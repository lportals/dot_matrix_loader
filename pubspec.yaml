name: dot_matrix_loader
description: >
  A zero-dependency Flutter library for premium dot-matrix loading animations.
  Render animated NxM dot grids with 10 built-in presets and a custom builder API.
version: 0.1.0

homepage: https://github.com/lportals/dot_matrix_loader
repository: https://github.com/lportals/dot_matrix_loader

topics:
  - flutter
  - animation
  - loading
  - ui
  - widgets

environment:
  sdk: ^3.7.0
  flutter: ">=3.29.0"

dependencies:
  flutter:
    sdk: flutter

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
