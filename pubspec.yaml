name: dot_matrix_loader
description: A zero-dependency Flutter package for premium dot-matrix loading animations. Render animated NxM dot grids with 61 built-in presets, a custom builder API, and a sequence API.
version: 0.2.0

homepage: https://github.com/lportals/dot_matrix_loader
repository: https://github.com/lportals/dot_matrix_loader
issue_tracker: https://github.com/lportals/dot_matrix_loader/issues

topics:
  - flutter
  - animation
  - loading
  - ui
  - widgets

platforms:
  android:
  ios:
  web:
  macos:
  windows:
  linux:

environment:
  sdk: ^3.7.0
  flutter: ">=3.29.0"

dependencies:
  flutter:
    sdk: flutter

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0

flutter:
  uses-material-design: true
